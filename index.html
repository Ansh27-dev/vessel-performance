<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VoyageIQ — AI-powered vessel performance monitoring and voyage optimization platform for maritime operations. Track fuel, speed, weather, and commercial claims.">
    <title>VoyageIQ — Vessel Performance & Voyage Optimization</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- App Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/charts.css">

    <style>
        /* Loading Screen */
        #loader {
            position: fixed; inset: 0; z-index: 10000;
            background: #0a0e27;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        #loader.fade-out { opacity: 0; pointer-events: none; }
        .loader-icon {
            width: 80px; height: 80px;
            border: 3px solid rgba(0,212,255,0.15);
            border-top-color: #00d4ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        .loader-title {
            margin-top: 28px; font-family: 'Inter', sans-serif;
            font-size: 26px; font-weight: 700; color: #e2e8f0;
            letter-spacing: -0.5px;
        }
        .loader-title span { color: #00d4ff; }
        .loader-sub {
            margin-top: 8px; font-family: 'Inter', sans-serif;
            font-size: 13px; color: #64748b;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loader">
        <div class="loader-icon"></div>
        <div class="loader-title">Voyage<span>IQ</span></div>
        <div class="loader-sub">AI-Powered Maritime Intelligence</div>
    </div>

    <!-- App Root -->
    <div id="app"></div>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- SheetJS (Excel Parser) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- App Modules (order matters) -->
    <script src="js/data.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/voyage-optimizer.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/maps.js"></script>
    <script src="js/excel-parser.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
